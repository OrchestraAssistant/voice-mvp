<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Enable microphone</title>
    <style>
      body { font: 15px system-ui, sans-serif; max-width: 460px; margin: 60px auto; padding: 0 20px; color: #222; }
      h1 { font-size: 20px; }
      button { font: inherit; padding: 10px 16px; border-radius: 10px; border: 1px solid #111; background: #111; color: #fff; cursor: pointer; }
      #status { margin-top: 16px; color: #555; }
      p { line-height: 1.5; }
    </style>
  </head>
  <body>
    <h1>Enable the microphone</h1>
    <p>
      Voice needs the microphone once. Granting it here (in this tab, where the
      prompt is stable) enables it for every site, and the session that lives in
      the browser can then use it without asking again.
    </p>
    <button id="enable">Enable microphone</button>
    <div id="status"></div>
    <script type="module" src="dist/permission.js"></script>
  </body>
</html>
