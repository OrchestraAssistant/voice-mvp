<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px system-ui, sans-serif; width: 220px; margin: 0; padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 10px; }
      button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; width: 100%; margin-bottom: 8px; }
      button.primary { background: #111; color: #fff; border-color: #111; }
      #status { color: #555; font-size: 12px; min-height: 2.2em; }
    </style>
  </head>
  <body>
    <h1>Voice on this tab</h1>
    <button id="start" class="primary">Start voice</button>
    <button id="stop">Stop</button>
    <div id="status">The session persists across page reloads.</div>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
