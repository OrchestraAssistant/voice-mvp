<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Voice session observer</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --line:#252a37; --ink:#e6e8ee; --dim:#8b93a7;
          --user:#7cc4ff; --agent:#9be89b; --tool:#c9b3ff; --err:#ff8f8f; --accent:#5b3bff; }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--ink);
      font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; display:grid; grid-template-columns:320px 1fr; height:100vh }
  aside { border-right:1px solid var(--line); overflow:auto; background:var(--panel) }
  main { overflow:auto; padding:18px 22px }
  h1 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:14px 16px 8px }
  .s { padding:10px 16px; border-bottom:1px solid var(--line); cursor:pointer }
  .s:hover { background:#1d212c } .s.active { background:#20263a; border-left:3px solid var(--accent); padding-left:13px }
  .s .when { color:var(--dim); font-size:12px } .s .q { color:var(--ink); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .row { display:flex; gap:10px; padding:5px 0; border-bottom:1px solid #1c2029; align-items:baseline }
  .t { color:var(--dim); width:64px; flex:none; text-align:right; font-size:12px }
  .gap { color:#5a6274; width:60px; flex:none; text-align:right; font-size:12px }
  .k { flex:none; width:130px; font-weight:600 }
  .k.user{color:var(--user)} .k.agent{color:var(--agent)} .k.tool{color:var(--tool)} .k.fail{color:var(--err)} .k.meta{color:var(--dim)}
  .v { white-space:pre-wrap; word-break:break-word; flex:1 } .v .err { color:var(--err) }
  .badge { font-size:11px; color:var(--dim); border:1px solid var(--line); border-radius:10px; padding:0 7px; margin-left:6px }
  .hint { color:var(--dim); padding:40px; text-align:center }
  code { background:#20242f; padding:1px 5px; border-radius:4px }
  .total { font-size:13px; color:var(--dim); margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--line) } .total b { color:#9be89b }
  .cost { color:#e0c98a; font-size:11px; border:1px solid #3a3524; border-radius:10px; padding:0 6px; margin-left:6px }
</style></head>
<body>
  <aside><h1>Sessions</h1><div id="list"></div></aside>
  <main id="view"><div class="hint">Pick a session on the left.</div></main>
<script>
const rel = ""; // same origin as the relay proxy
const listEl = document.getElementById("list");
const viewEl = document.getElementById("view");
let active = null;

const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const shortTime = (iso) => (iso ? iso.replace("T"," ").replace(/\..*/,"").slice(5) : "");

async function loadList() {
  const r = await fetch(rel + "/voice/observer/sessions");
  const rows = await r.json();
  listEl.innerHTML = rows.map((s) => `
    <div class="s" data-id="${esc(s.id)}">
      <div class="when">${shortTime(s.at)}${s.model ? " · " + esc(s.model) : ""}</div>
      <div class="q">${s.firstUser ? esc(s.firstUser) : "<span style='color:#5a6274'>(no turn)</span>"}</div>
    </div>`).join("") || "<div class='hint'>No sessions yet.</div>";
  listEl.querySelectorAll(".s").forEach((el) => el.onclick = () => open(el.dataset.id, el));
}

async function open(id, el) {
  listEl.querySelectorAll(".s").forEach((s) => s.classList.remove("active"));
  el?.classList.add("active");
  active = id;
  const r = await fetch(rel + "/voice/observer/session/" + encodeURIComponent(id));
  const { events, cost } = await r.json();
  render(events, cost);
}

function render(ev, cost) {
  if (!ev.length) { viewEl.innerHTML = "<div class='hint'>Empty session.</div>"; return; }
  const t0 = Date.parse(ev[0].at);
  const header = cost && cost.total != null
    ? `<div class="total">session cost: <b>$${cost.total.toFixed(4)}</b> <span style="color:#5a6274">· ${esc(cost.model||"")}</span></div>`
    : (cost && !cost.priced ? `<div class="total" style="color:#8b93a7">unpriced model${cost.model?" ("+esc(cost.model)+")":""}</div>` : "");

  // A response spans from one response_requested to the next. With
  // create_response:false the widget sends a fresh response.create after every
  // tool result, so a SINGLE spoken turn produces several responses -- each
  // stamped with the same standing transcript. Rendering each as its own "user"
  // line made one utterance look like it was repeated a dozen times. So group by
  // response: show the user's words only when they actually change, and let each
  // response show what it DID, with its cost on that row.
  const segs = [];
  for (const e of ev) {
    if (e.type === "response_requested") segs.push({ transcript: e.transcript, at: e.at, events: [] });
    else if (segs.length) segs[segs.length - 1].events.push(e);
  }

  // Coalesce the interim and final transcripts of ONE spoken turn. Realtime
  // streams a partial ("Go to the") then the final ("Go to the bookings page."),
  // and each fires its own response; shown as two rows they read as the user
  // repeating themselves. A run where each transcript is a prefix of the next,
  // and close in time, is one turn -- labelled with the final (longest) text,
  // with every response under it. The time guard keeps a genuinely short
  // utterance ("No.") from swallowing a later one that happens to start the same.
  const norm = (s) => (s || "").trim().toLowerCase();
  const prefixRelated = (a, b) => {
    const x = norm(a), y = norm(b);
    return x && y && (x.startsWith(y) || y.startsWith(x));
  };
  const turns = [];
  for (const seg of segs) {
    const last = turns[turns.length - 1];
    const closeInTime = last && Date.parse(seg.at) - Date.parse(last.at) < 8000;
    if (last && closeInTime && prefixRelated(last.transcript, seg.transcript)) {
      if ((seg.transcript || "").length > (last.transcript || "").length) last.transcript = seg.transcript;
      last.events.push(...seg.events);
    } else {
      turns.push({ transcript: seg.transcript, at: seg.at, events: [...seg.events] });
    }
  }

  let prev = null, lastUser = null;
  const rows = [];
  const push = (at, kind, who, v, badge = "") => {
    const t = (Date.parse(at) - t0) / 1000;
    const gap = prev === null ? "" : "+" + (t - prev).toFixed(1) + "s";
    prev = t;
    rows.push(`<div class="row"><div class="t">${t.toFixed(1)}s</div><div class="gap">${gap}</div><div class="k ${kind}">${esc(who)}</div><div class="v">${v}${badge}</div></div>`);
  };

  for (const seg of turns) {
    if (seg.transcript && seg.transcript !== lastUser) {
      lastUser = seg.transcript;
      push(seg.at, "user", "user", esc(seg.transcript));
    }
    // The cost is the response's, wherever its usage event fell relative to the
    // tool call (before it for a function call, after it for a spoken reply).
    const usage = seg.events.find((e) => e.type === "usage" && e.costUSD != null);
    const badge = usage ? ` <span class="cost">$${usage.costUSD.toFixed(5)}</span>` : "";
    const outputs = seg.events.filter((e) => ["tool_call", "assistant_reply", "response_failed"].includes(e.type));
    outputs.forEach((e, i) => {
      const b = i === outputs.length - 1 ? badge : ""; // cost on the response's last output
      if (e.type === "assistant_reply") push(e.at, "agent", "agent", esc(e.text), b);
      else if (e.type === "response_failed") push(e.at, "fail", "✗ " + (e.code||"failed"), esc(e.message||"") + (e.retrying?' <span class="badge">retrying</span>':''), b);
      else {
        const res = e.result || {};
        const isErr = res.error || res.stop;
        const args = JSON.stringify(e.args ?? {});
        const out = res.stop || res.error || res.status || JSON.stringify(res).slice(0, 200);
        const v = `<span style="color:#8b93a7">${esc(args.slice(0,140))}</span>\n<span class="${isErr?'err':''}">→ ${esc(String(out).slice(0,300))}</span>`;
        push(e.at, isErr ? "fail" : "tool", e.name, v, b);
      }
    });
    // A response that produced no visible row (only a deferred/coalesced one)
    // still shows its cost, folded onto whatever the last row is.
    if (!outputs.length && badge && rows.length) {
      rows[rows.length - 1] = rows[rows.length - 1].replace("</div></div>", badge + "</div></div>");
    }
  }
  viewEl.innerHTML = header + (rows.join("") || "<div class='hint'>Empty session.</div>");
}

loadList();
setInterval(() => { loadList(); if (active) fetch(rel + "/voice/observer/session/" + encodeURIComponent(active)).then(r=>r.json()).then(d=>render(d.events, d.cost)); }, 5000);
</script>
</body></html>
